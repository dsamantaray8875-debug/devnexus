apiVersion: v1
kind: ServiceAccount
metadata:
  name: devnexus-readonly
  namespace: devnexus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devnexus-readonly
  namespace: devnexus
rules:
- apiGroups: [""]
  resources:
  - pods
  - services
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups: ["apps"]
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devnexus-readonly
  namespace: devnexus
subjects:
- kind: ServiceAccount
  name: devnexus-readonly
  namespace: devnexus
roleRef:
  kind: Role
  name: devnexus-readonly
  apiGroup: rbac.authorization.k8s.io
