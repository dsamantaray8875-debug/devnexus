apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devnexus
  labels:
    app: frontend
    project: devnexus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        project: devnexus
    spec:
      containers:
        - name: frontend
          image: 362928919640.dkr.ecr.us-east-1.amazonaws.com/devnexus/frontend:1.0
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
