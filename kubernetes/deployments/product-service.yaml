apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: devnexus
  labels:
    app: product-service
    project: devnexus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        project: devnexus
    spec:
      containers:
        - name: product-service
          image: 362928919640.dkr.ecr.us-east-1.amazonaws.com/devnexus/product-service:1.0
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /products/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /products/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
