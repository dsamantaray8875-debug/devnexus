apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: devnexus
  labels:
    app: user-service
    project: devnexus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        project: devnexus
    spec:
      containers:
        - name: user-service
          image: 362928919640.dkr.ecr.us-east-1.amazonaws.com/devnexus/user-service:1.0
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
