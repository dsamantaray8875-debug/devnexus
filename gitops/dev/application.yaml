apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devnexus-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:dsamantaray8875-debug/devnexus.git
    targetRevision: main
    path: helm/devnexus
    helm:
      valueFiles:
        - ../../gitops/dev/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: devnexus

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
